<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autopropelido em Jacareí</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #mapa { position: absolute; inset: 0; }
  #legenda {
    position: absolute; z-index: 1000; left: 12px; bottom: 24px;
    background: #fff; padding: 10px 12px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.35); font-size: 14px; line-height: 1.7;
  }
  #legenda i { display: inline-block; width: 26px; height: 5px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
  #gps {
    position: absolute; z-index: 1000; right: 12px; bottom: 24px;
    background: #fff; border: 0; padding: 12px 14px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.35); font-size: 15px;
  }
  #msg {
    position: absolute; z-index: 1000; top: 12px; left: 50%; transform: translateX(-50%);
    background: #fff; padding: 8px 12px; border-radius: 8px; font-size: 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,.35); display: none;
  }
</style>
</head>
<body>
<div id="mapa"></div>
<div id="msg"></div>
<div id="legenda">
  <div><i style="background:#1b8a3a"></i>Ciclovia</div>
  <div><i style="background:#f08a00"></i>Ciclofaixa</div>
  <div><i style="background:#1f6fd1"></i>Rua de até 40 km/h</div>
  <div><i style="background:#d11f1f"></i>Não pode (mais de 40)</div>
</div>
<button id="gps">Minha localização</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var JACAREI = [-23.3053, -45.9658];
var ZOOM_MIN = 14;
var CELULA = 0.01; // graus (~1 km): o mapa carrega por quadrados e guarda o que já veio
var ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];
var COR = { ciclovia: '#1b8a3a', ciclofaixa: '#f08a00', via40: '#1f6fd1', nao: '#d11f1f' };
var NOME = { ciclovia: 'Pode: ciclovia', ciclofaixa: 'Pode: ciclofaixa', via40: 'Pode: rua de até 40 km/h', nao: 'Não pode: mais de 40 km/h' };

var mapa = L.map('mapa', { zoomControl: true, preferCanvas: true }).setView(JACAREI, 15);
mapa.createPane('gps').style.zIndex = 650;
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(mapa);

// uma camada por tipo, na ordem em que são desenhadas (a última fica por cima)
var camadas = {};
['nao', 'via40', 'ciclofaixa', 'ciclovia'].forEach(function (t) { camadas[t] = L.layerGroup().addTo(mapa); });
var msg = document.getElementById('msg');
function aviso(t) { msg.textContent = t; msg.style.display = t ? 'block' : 'none'; }

function velocidade(v) {
  var m = /^\s*(\d+)/.exec(v || '');
  return m ? parseInt(m[1], 10) : null;
}

// devolve { tipo, motivo }
function classificar(tags) {
  var hw = tags.highway || '';
  if (hw === 'cycleway') return { tipo: 'ciclovia', motivo: 'Marcada no mapa como ciclovia.' };
  if (/^(path|footway|pedestrian|track)$/.test(hw)) return { tipo: 'ciclovia', motivo: 'Caminho marcado no mapa como próprio para bicicleta.' };
  var lados = [tags.cycleway, tags['cycleway:left'], tags['cycleway:right'], tags['cycleway:both']];
  var track = lados.indexOf('track') >= 0, lane = lados.indexOf('lane') >= 0;
  if (track) return { tipo: 'ciclovia', motivo: 'Tem ciclovia ao lado da rua (cycleway=track).' };
  if (lane) return { tipo: 'ciclofaixa', motivo: 'Tem ciclofaixa na rua (cycleway=lane).' };
  var base = hw.replace(/_link$/, '');
  var ms = velocidade(tags.maxspeed);
  if (ms !== null) {
    return ms <= 40
      ? { tipo: 'via40', motivo: 'Velocidade marcada no mapa: ' + ms + ' km/h.' }
      : { tipo: 'nao', motivo: 'Velocidade marcada no mapa: ' + ms + ' km/h (acima de 40).' };
  }
  // sem velocidade marcada: vale o CTB, art. 61
  if (/^(residential|living_street|unclassified)$/.test(base)) return { tipo: 'via40', motivo: 'Sem velocidade marcada. Via local: 30 km/h pelo CTB.' };
  if (base === 'tertiary') return { tipo: 'via40', motivo: 'Sem velocidade marcada. Via coletora: 40 km/h pelo CTB.' };
  if (/^(secondary|primary)$/.test(base)) return { tipo: 'nao', motivo: 'Sem velocidade marcada. Via arterial: 60 km/h pelo CTB.' };
  return { tipo: 'nao', motivo: 'Sem velocidade marcada. Via de trânsito rápido: 80 km/h pelo CTB.' };
}

function popup(tags, c) {
  var d = document.createElement('div');
  d.style.cssText = 'font-size:13px;line-height:1.5;max-width:240px';
  function linha(txt, estilo) { var p = document.createElement('div'); p.textContent = txt; if (estilo) p.style.cssText = estilo; d.appendChild(p); }
  linha(tags.name || 'Sem nome', 'font-weight:bold;font-size:14px');
  linha(NOME[c.tipo], 'color:' + COR[c.tipo] + ';font-weight:bold');
  linha(c.motivo);
  linha('Tipo no mapa: ' + (tags.highway || '-'));
  linha('Velocidade marcada: ' + (tags.maxspeed || 'não marcada'));
  var todas = Object.keys(tags).map(function (k) { return k + '=' + tags[k]; }).join('\n');
  linha(todas, 'white-space:pre-wrap;color:#666;font-size:11px;margin-top:6px');
  return d;
}

var jaTem = {};        // ids de vias já desenhadas
var celulasOk = {};    // quadrados já carregados
var pendentes = 0;

function chaveCelula(i, j) { return i + ',' + j; }

function carregar() {
  if (mapa.getZoom() < ZOOM_MIN) { aviso('Aproxime o mapa para ver as vias'); return; }
  var b = mapa.getBounds();
  var i0 = Math.floor((b.getSouth() - CELULA) / CELULA), i1 = Math.floor((b.getNorth() + CELULA) / CELULA);
  var j0 = Math.floor((b.getWest() - CELULA) / CELULA), j1 = Math.floor((b.getEast() + CELULA) / CELULA);
  var faltam = [], mi = 1e9, ma = -1e9, mj = 1e9, mb = -1e9;
  for (var i = i0; i <= i1; i++) for (var j = j0; j <= j1; j++) {
    if (celulasOk[chaveCelula(i, j)]) continue;
    faltam.push([i, j]);
    mi = Math.min(mi, i); ma = Math.max(ma, i); mj = Math.min(mj, j); mb = Math.max(mb, j);
  }
  if (!faltam.length) return;
  var bbox = [mi * CELULA, mj * CELULA, (ma + 1) * CELULA, (mb + 1) * CELULA].join(',');
  var q = '[out:json][timeout:60];(' +
    'way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$"](' + bbox + ');' +
    'way["highway"="cycleway"](' + bbox + ');' +
    'way["highway"~"^(path|footway|pedestrian|track)$"]["bicycle"="designated"](' + bbox + ');' +
    ');out geom tags;';
  faltam.forEach(function (c) { celulasOk[chaveCelula(c[0], c[1])] = 'indo'; });
  pendentes++; aviso('Carregando…');
  var falha = '';

  function terminou(ok) {
    pendentes--;
    faltam.forEach(function (c) { if (ok) celulasOk[chaveCelula(c[0], c[1])] = true; else delete celulasOk[chaveCelula(c[0], c[1])]; });
    if (ok) { if (!pendentes) aviso(''); }
    else aviso('Sem conexão com o mapa' + (falha ? ' (' + falha + ')' : ''));
  }
  function tentar(k) {
    if (k >= ENDPOINTS.length) { terminou(false); return; }
    fetch(ENDPOINTS[k], { method: 'POST', body: 'data=' + encodeURIComponent(q),
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' } })
      .then(function (r) { if (!r.ok) throw new Error('erro ' + r.status); return r.json(); })
      .then(function (j) { desenhar(j.elements || []); terminou(true); })
      .catch(function (e) { falha = String(e && e.message || e).slice(0, 40); tentar(k + 1); });
  }
  tentar(0);
}

function desenhar(elementos) {
  elementos.forEach(function (e) {
    if (!e.geometry || !e.tags || jaTem[e.id]) return;
    jaTem[e.id] = true;
    var c = classificar(e.tags);
    var pts = e.geometry.map(function (p) { return [p.lat, p.lon]; });
    L.polyline(pts, { color: COR[c.tipo], weight: c.tipo === 'nao' ? 4 : 5, opacity: c.tipo === 'nao' ? .7 : .9 })
      .bindPopup(popup(e.tags, c))
      .addTo(camadas[c.tipo]);
  });
}

mapa.on('moveend', carregar);
carregar();

// GPS
var marcador = null, circulo = null, primeiraVez = true;
function posicao(p) {
  var ll = [p.coords.latitude, p.coords.longitude];
  if (!marcador) {
    circulo = L.circle(ll, { radius: p.coords.accuracy, color: '#d11f1f', weight: 1, fillOpacity: .08, pane: 'gps', interactive: false }).addTo(mapa);
    marcador = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#7a1fd1', fillOpacity: 1, pane: 'gps', interactive: false }).addTo(mapa);
  } else {
    marcador.setLatLng(ll);
    circulo.setLatLng(ll).setRadius(p.coords.accuracy);
  }
  if (primeiraVez) { primeiraVez = false; mapa.setView(ll, 16); }
}
function iniciarGps() {
  if (!navigator.geolocation) { aviso('Este aparelho não tem GPS'); return; }
  navigator.geolocation.watchPosition(posicao,
    function () { aviso('Permita o acesso à localização'); },
    { enableHighAccuracy: true, maximumAge: 5000 });
}
document.getElementById('gps').addEventListener('click', function () {
  if (marcador) mapa.setView(marcador.getLatLng(), 16);
  else { primeiraVez = true; iniciarGps(); }
});
iniciarGps();
</script>
</body>
</html>
