<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autopropelido em Jacareí</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7a1fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Autopropelido">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icone-32.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="icone-48.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png?v=2">
<link rel="shortcut icon" href="icone-32.png?v=2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; overflow: hidden; }
  #atrib { position: absolute; z-index: 900; right: 4px; bottom: 2px; font-size: 10px; background: rgba(255,255,255,.75); padding: 1px 4px; }
  #bussola, #visao-geral { display: none; }
  #seta { width: 36px; height: 36px; }
  #mapa { position: absolute; inset: 0; }
  #legenda {
    display: none;
    position: absolute; z-index: 1000; left: 12px; bottom: 80px;
    background: #fff; padding: 10px 12px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.35); font-size: 14px; line-height: 1.7;
  }
  #legenda i { display: inline-block; width: 26px; height: 5px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
  #gps, #btn-legenda {
    position: absolute; z-index: 1000; bottom: 24px; width: 48px; height: 48px; padding: 0;
    background: #fff; border: 0; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
  }
  #gps { right: 12px; }
  #visao-geral { position: absolute; z-index: 1000; right: 12px; bottom: 144px; width: 48px; height: 48px; padding: 0; background: #fff; border: 0; border-radius: 50%; box-shadow: 0 1px 6px rgba(0,0,0,.35); align-items: center; justify-content: center; }
  #visao-geral.ativa { background: #7a1fd1; }
  #visao-geral.ativa path { stroke: #fff; }
  #bussola { position: absolute; z-index: 1000; right: 12px; bottom: 84px; width: 48px; height: 48px; padding: 0; background: #fff; border: 0; border-radius: 50%; box-shadow: 0 1px 6px rgba(0,0,0,.35); align-items: center; justify-content: center; }
  #btn-legenda { left: 12px; }
  #painel {
    position: absolute; z-index: 1000; top: 12px; left: 56px; right: 12px; max-width: 440px;
    background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.35); padding: 8px; font-size: 14px;
  }
  #painel .linha { display: flex; gap: 6px; }
  #painel input { flex: 1; min-width: 0; font-size: 16px; padding: 8px; border: 1px solid #bbb; border-radius: 6px; }
  #painel button { font-size: 15px; padding: 8px 10px; border: 0; border-radius: 6px; background: #7a1fd1; color: #fff; }
  #painel button.leve { background: #eee; color: #222; }
  #achados button { display: block; width: 100%; text-align: left; margin-top: 6px; background: #f3f3f3; color: #222; }
  #resumo .linha-rota { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #resumo .guia-instr { font-size: 20px; font-weight: bold; line-height: 1.25; }
  #resumo .guia-resto { flex: 1; color: #555; }
  #resumo .soma { flex: 1; font-weight: bold; }
  #resumo button { padding: 8px 12px; }
  #resumo .aviso-rota { margin-top: 4px; color: #8a6d00; font-size: 13px; }
  #resumo .lista-ruas { margin-top: 6px; max-height: 38vh; overflow: auto; line-height: 1.6; }
  .acao { display: inline-block; margin: 6px 6px 0 0; font-size: 15px; padding: 8px 10px; border: 0; border-radius: 6px; background: #7a1fd1; color: #fff; }
  .pino { width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: bold; text-align: center; line-height: 28px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #msg {
    position: absolute; z-index: 1000; top: 70px; left: 50%; transform: translateX(-50%);
    background: #fff; padding: 8px 12px; border-radius: 8px; font-size: 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,.35); display: none;
  }
</style>
</head>
<body>
<div id="mapa"></div>
<div id="atrib">&copy; OpenStreetMap · Leaflet</div>
<div id="painel">
  <div class="linha" id="linha-busca"><input id="busca" type="search" placeholder="Para onde? (rua, bairro, lugar)" autocomplete="off"><button id="buscar">Buscar</button></div>
  <div id="achados"></div>
  <div id="resumo"></div>
</div>
<div id="msg"></div>
<div id="legenda">
  <div><i style="background:#0d6b2e"></i>Ciclovia</div>
  <div><i style="background:#6fd17a"></i>Ciclofaixa</div>
  <div><i style="background:#1f6fd1"></i>Rua de até 40 km/h</div>
  <div><i style="background:repeating-linear-gradient(90deg,#d4a900 0 9px,transparent 9px 14px)"></i>Sem velocidade marcada (veja a placa)</div>
  <div><i style="background:#d11f1f"></i>Não pode (mais de 40)</div>
</div>
<button id="btn-legenda" aria-label="Mostrar ou esconder o que cada cor significa">
  <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke-width="3.5" stroke-linecap="round"><path d="M4 5h18" stroke="#1b8a3a"/><path d="M4 11h18" stroke="#1f6fd1"/><path d="M4 17h18" stroke="#d4a900"/><path d="M4 23h18" stroke="#d11f1f"/></svg>
</button>
<button id="visao-geral" aria-label="Ver o caminho todo"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10V4h6M16 4h6v6M22 16v6h-6M10 22H4v-6" stroke="#7a1fd1"/></svg></button>
<button id="bussola" aria-label="Alternar entre norte para cima e direção para cima"><svg id="agulha" width="30" height="30" viewBox="0 0 30 30"><path d="M15 3 L21 15 H9 Z" fill="#d11f1f"/><path d="M15 27 L21 15 H9 Z" fill="#999"/><circle cx="15" cy="15" r="2" fill="#fff"/></svg></button>
<button id="gps" aria-label="Ir para a minha localização">
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#7a1fd1" stroke-width="2.6" stroke-linecap="round"><circle cx="14" cy="14" r="7"/><circle cx="14" cy="14" r="2.5" fill="#7a1fd1"/><path d="M14 2v4M14 22v4M2 14h4M22 14h4"/></svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="rota.js?v=2"></script>
<script src="guia.js?v=1"></script>
<script>
var JACAREI = [-23.3053, -45.9658];
var COR = { ciclovia: '#0d6b2e', ciclofaixa: '#6fd17a', via40: '#1f6fd1', incerta: '#d4a900', nao: '#d11f1f' };
var NOME = { ciclovia: 'Pode: ciclovia', ciclofaixa: 'Pode: ciclofaixa', via40: 'Pode: rua de até 40 km/h', incerta: 'Velocidade não marcada: confira a placa', nao: 'Não pode: mais de 40 km/h' };

var mapa = L.map('mapa', { zoomControl: true, attributionControl: false, renderer: L.canvas({ tolerance: 8 }) }).setView(JACAREI, 15);
mapa.createPane('gps').style.zIndex = 650;
// fundo do mapa: OpenStreetMap (as linhas ficam finas e translúcidas para dar para ler o nome das ruas)
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(mapa);
mapa.createPane('rotulos').style.zIndex = 450; // (reservado)

// uma camada por tipo, na ordem em que são desenhadas (a última fica por cima)
var camadas = {};
['nao', 'incerta', 'via40', 'ciclofaixa', 'ciclovia'].forEach(function (t) { camadas[t] = L.layerGroup().addTo(mapa); });
var msg = document.getElementById('msg');
function aviso(t) { msg.textContent = t; msg.style.display = t ? 'block' : 'none'; }

function velocidade(v) {
  var m = /^\s*(\d+)/.exec(v || '');
  return m ? parseInt(m[1], 10) : null;
}

// devolve { tipo, motivo }
function classificar(tags, nomes) {
  var hw = tags.highway || '';
  if (hw === 'cycleway') return { tipo: 'ciclovia', motivo: 'Marcada no mapa como ciclovia.' };
  if (/^(path|footway|pedestrian|track)$/.test(hw)) return { tipo: 'ciclovia', motivo: 'Caminho marcado no mapa como próprio para bicicleta.' };
  var lados = [tags.cycleway, tags['cycleway:left'], tags['cycleway:right'], tags['cycleway:both']];
  var track = lados.indexOf('track') >= 0, lane = lados.indexOf('lane') >= 0;
  if (track) return { tipo: 'ciclovia', motivo: 'Tem ciclovia ao lado da rua (cycleway=track).' };
  if (lane) return { tipo: 'ciclofaixa', motivo: 'Tem ciclofaixa na rua (cycleway=lane).' };
  var base = hw.replace(/_link$/, '');
  var ms = velocidade(tags.maxspeed);
  if (ms !== null) {
    return ms <= 40
      ? { tipo: 'via40', motivo: 'Velocidade marcada no mapa: ' + ms + ' km/h.' }
      : { tipo: 'nao', motivo: 'Velocidade marcada no mapa: ' + ms + ' km/h (acima de 40).' };
  }
  // sem velocidade marcada neste trecho: olha os outros trechos da mesma rua
  var n = nomes && tags.name && nomes[tags.name];
  if (n) {
    if (n.max <= 40) return { tipo: 'via40', motivo: 'Sem velocidade marcada neste trecho, mas os outros trechos da mesma rua estão marcados com ' + n.max + ' km/h.' };
    if (n.min > 40) return { tipo: 'nao', motivo: 'Sem velocidade marcada neste trecho, mas os outros trechos da mesma rua estão marcados com ' + n.min + ' km/h.' };
  }
  // sem nenhuma marcação: vale o CTB, art. 61, nas ruas que são claramente locais ou coletoras
  if (/^(residential|living_street|unclassified)$/.test(base)) return { tipo: 'via40', motivo: 'Sem velocidade marcada. Via local: 30 km/h pelo CTB.' };
  if (base === 'tertiary') return { tipo: 'via40', motivo: 'Sem velocidade marcada. Via coletora: 40 km/h pelo CTB.' };
  if (/^(secondary|primary)$/.test(base)) return { tipo: 'incerta', motivo: 'Sem velocidade marcada. Pode ser coletora (40 km/h) ou arterial (60 km/h): vale a placa da rua.' };
  return { tipo: 'nao', motivo: 'Sem velocidade marcada. Via de trânsito rápido: 80 km/h pelo CTB.' };
}

function acoes(latlng) {
  var d = document.createElement('div');
  [['Sair daqui', 'origem'], ['Ir até aqui', 'destino']].forEach(function (a) {
    var b = document.createElement('button'); b.className = 'acao'; b.textContent = a[0];
    b.addEventListener('click', function () { mapa.closePopup(); definir(a[1], latlng.lat, latlng.lng); });
    d.appendChild(b);
  });
  return d;
}

function popup(tags, c, latlng) {
  var d = document.createElement('div');
  d.style.cssText = 'font-size:13px;line-height:1.5;max-width:240px';
  function linha(txt, estilo) { var p = document.createElement('div'); p.textContent = txt; if (estilo) p.style.cssText = estilo; d.appendChild(p); }
  linha(tags.name || 'Sem nome', 'font-weight:bold;font-size:14px');
  linha(NOME[c.tipo], 'color:' + COR[c.tipo] + ';font-weight:bold');
  linha(c.motivo);
  linha('Tipo no mapa: ' + (tags.highway || '-'));
  linha('Velocidade marcada: ' + (tags.maxspeed || 'não marcada'));
  var todas = Object.keys(tags).map(function (k) { return k + '=' + tags[k]; }).join('\n');
  d.appendChild(acoes(latlng));
  linha(todas, 'white-space:pre-wrap;color:#666;font-size:11px;margin-top:6px');
  return d;
}

function desenhar(vias) {
  // velocidades marcadas em cada rua (por nome), para valer nos trechos sem marcação
  var nomes = {};
  vias.forEach(function (v) {
    var ms = velocidade(v.t.maxspeed);
    if (ms === null || !v.t.name) return;
    var n = nomes[v.t.name] || (nomes[v.t.name] = { min: ms, max: ms });
    n.min = Math.min(n.min, ms); n.max = Math.max(n.max, ms);
  });
  vias.forEach(function (v) {
    var c = v.c = classificar(v.t, nomes);
    L.polyline(v.g, { color: COR[c.tipo], weight: c.tipo === 'nao' ? 3 : 4, opacity: c.tipo === 'nao' ? .55 : .7, dashArray: c.tipo === 'incerta' ? '10 8' : null, bubblingMouseEvents: false })
      .on('click', function (e) { L.popup().setLatLng(e.latlng).setContent(popup(v.t, c, e.latlng)).openOn(mapa); })
      .addTo(camadas[c.tipo]);
  });
  // o grafo para traçar caminho é montado logo depois, sem travar o desenho
  setTimeout(function () {
    grafo = Rota.construir(vias);
    if (calcularQuandoPronto) { calcularQuandoPronto = false; calcular(); }
  }, 50);
}

// os dados de Jacareí vêm prontos junto com o site (vias.json): nada de esperar servidor de mapa
aviso('Carregando…');
fetch('vias.json?v=2')
  .then(function (r) { if (!r.ok) throw new Error('erro ' + r.status); return r.json(); })
  .then(function (vias) { viasCarregadas = vias; desenhar(vias); aviso(''); })
  .catch(function (e) { aviso('Não foi possível carregar as vias (' + String(e && e.message || e).slice(0, 40) + ')'); });


// ---------- caminho ----------
var grafo = null, calcularQuandoPronto = false;
var origem = null, destino = null, pinos = { origem: null, destino: null };
var camadaRota = L.layerGroup().addTo(mapa);
var resumo = document.getElementById('resumo');
var VELOCIDADE_KMH = 15;

mapa.on('click', function (e) {
  var d = document.createElement('div');
  d.appendChild(acoes(e.latlng));
  L.popup().setLatLng(e.latlng).setContent(d).openOn(mapa);
});

function pino(letra, cor, ll) {
  return L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="pino" style="background:' + cor + '">' + letra + '</div>', iconSize: [28, 28], iconAnchor: [14, 14] }) });
}

function definir(tipo, lat, lon) {
  if (tipo === 'origem') origem = { lat: lat, lon: lon }; else destino = { lat: lat, lon: lon };
  if (pinos[tipo]) mapa.removeLayer(pinos[tipo]);
  pinos[tipo] = pino(tipo === 'origem' ? 'A' : 'B', tipo === 'origem' ? '#1b8a3a' : '#d11f1f', [lat, lon]).addTo(mapa);
  calcular();
}

function limpar() {
  if (guiando) sairNavegacao();
  guiando = false; if (travaTela) { try { travaTela.release(); } catch (e) {} travaTela = null; }
  origem = destino = null;
  ['origem', 'destino'].forEach(function (t) { if (pinos[t]) { mapa.removeLayer(pinos[t]); pinos[t] = null; } });
  camadaRota.clearLayers(); resumo.textContent = '';
  document.getElementById('linha-busca').style.display = 'flex';
}

function metros(m) { return m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' km' : Math.round(m / 10) * 10 + ' m'; }


// ---------- bússola e mapa que gira ----------
var orientacao = 'rumo';            // 'rumo' = direção para cima (como no Google Maps); 'norte' = norte para cima
var seguindo = true, rumoCss = null, giroPendente = false, ultimoLL = null, ultimoGps = 0, seta = null, bussolaLigada = false;
var btnVisao = document.getElementById('visao-geral'), elMapa = document.getElementById('mapa'), elAgulha = document.getElementById('agulha'), elBussola = document.getElementById('bussola');

function definirRumo(h, fonte) {
  if (h == null || isNaN(h)) return;
  if (fonte === 'bussola' && Date.now() - ultimoGps < 4000) return; // andando, vale o rumo do GPS
  if (fonte === 'gps') ultimoGps = Date.now();
  if (rumoCss === null) rumoCss = h;
  else { var d = ((h - rumoCss) % 360 + 540) % 360 - 180; rumoCss += d * 0.35; }
  if (!giroPendente) { giroPendente = true; requestAnimationFrame(function () { giroPendente = false; aplicarGiro(); }); }
}

function centrarNaPosicao() {
  if (!ultimoLL) return;
  var z = mapa.getZoom(), off = orientacao === 'rumo' ? window.innerHeight * 0.22 : 0;
  var pt = mapa.project(L.latLng(ultimoLL), z), h = (rumoCss || 0) * Math.PI / 180;
  if (orientacao === 'rumo') pt = pt.add([Math.sin(h) * off, -Math.cos(h) * off]);
  mapa.setView(mapa.unproject(pt, z), z, { animate: false });
}

function aplicarGiro() {
  if (seta && rumoCss !== null) { var el = seta.getElement(); if (el && el.firstChild) el.firstChild.style.transform = 'rotate(' + rumoCss + 'deg)'; }
  if (!guiando || !seguindo) return;
  var gira = orientacao === 'rumo' && rumoCss !== null;
  elAgulha.style.transform = gira ? 'rotate(' + (-rumoCss) + 'deg)' : 'none';
  elMapa.style.transform = gira ? 'rotate(' + (-rumoCss) + 'deg)' : 'none';
  centrarNaPosicao();
}

function prepararMapa(girando) {
  if (girando) {
    var D = Math.ceil(Math.hypot(window.innerWidth, window.innerHeight));
    elMapa.style.inset = 'auto'; elMapa.style.width = D + 'px'; elMapa.style.height = D + 'px';
    elMapa.style.left = ((window.innerWidth - D) / 2) + 'px'; elMapa.style.top = ((window.innerHeight - D) / 2) + 'px';
    elMapa.style.transition = 'transform .25s linear';
  } else {
    elMapa.style.inset = '0'; elMapa.style.width = ''; elMapa.style.height = ''; elMapa.style.left = ''; elMapa.style.top = '';
    elMapa.style.transform = 'none'; elMapa.style.transition = '';
  }
  ['dragging', 'touchZoom', 'doubleClickZoom', 'scrollWheelZoom', 'boxZoom'].forEach(function (k) { if (mapa[k]) girando ? mapa[k].disable() : mapa[k].enable(); });
  var zc = document.querySelector('.leaflet-control-zoom'); if (zc) zc.style.display = girando ? 'none' : '';
  mapa.invalidateSize({ animate: false });
}

function ligarBussola() {
  if (bussolaLigada) return; bussolaLigada = true;
  function ao(e) {
    var h = null;
    if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
    else if (e.absolute && e.alpha != null) h = 360 - e.alpha;
    if (h === null) return;
    var ang = (screen.orientation && screen.orientation.angle) || 0;
    definirRumo((h + ang + 360) % 360, 'bussola');
  }
  window.addEventListener('deviceorientationabsolute', ao, true);
  window.addEventListener('deviceorientation', ao, true);
}
function pedirBussola() {
  ligarBussola(); // sem permissão os eventos simplesmente não chegam; com permissão passam a chegar
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission().catch(function () {});
  } catch (e) {}
}

function entrarNavegacao() {
  seguindo = true; btnVisao.classList.remove('ativa'); btnVisao.style.display = 'flex';
  orientacao = 'rumo'; elBussola.style.display = 'flex';
  prepararMapa(true);
  if (mapa.getZoom() < 18) mapa.setZoom(18, { animate: false });
  aplicarGiro();
}
function sairNavegacao() {
  seguindo = true; btnVisao.style.display = 'none'; btnVisao.classList.remove('ativa');
  elBussola.style.display = 'none'; orientacao = 'rumo';
  prepararMapa(false); elAgulha.style.transform = 'none';
  if (ultimoLL) mapa.setView(ultimoLL, Math.min(mapa.getZoom(), 17), { animate: false });
}
elBussola.addEventListener('click', function () {
  orientacao = orientacao === 'rumo' ? 'norte' : 'rumo';
  prepararMapa(orientacao === 'rumo');
  if (orientacao === 'norte') { elAgulha.style.transform = 'none'; elMapa.style.transform = 'none'; }
  aplicarGiro();
});
// visão geral: encolhe o mapa para ver o caminho todo e deixa mexer à vontade; tocar de novo (ou na mira) volta ao guia
function modoGeral() {
  if (!guiando || !rotaAtual) return;
  seguindo = false; btnVisao.classList.add('ativa'); elBussola.style.display = 'none';
  prepararMapa(false); elAgulha.style.transform = 'none';
  var b = L.latLngBounds(rotaAtual.pts); if (ultimoLL) b.extend(ultimoLL);
  mapa.fitBounds(b, { paddingTopLeft: [20, 150], paddingBottomRight: [20, 100], animate: false });
}
function voltarAoGuia() {
  if (!guiando) return;
  seguindo = true; btnVisao.classList.remove('ativa'); elBussola.style.display = 'flex';
  prepararMapa(orientacao === 'rumo');
  if (mapa.getZoom() < 18) mapa.setZoom(18, { animate: false });
  aplicarGiro();
}
btnVisao.addEventListener('click', function () { if (seguindo) modoGeral(); else voltarAoGuia(); });
window.addEventListener('resize', function () { if (guiando && seguindo && orientacao === 'rumo') { prepararMapa(true); aplicarGiro(); } });

var guiando = false, rotaAtual = null, linhaRota = null, progresso = 0, foraConta = 0, travaTela = null;

function calcular(opcoes) {
  var emGuia = !!(opcoes && opcoes.guia);
  var de = (origem && !emGuia) ? origem : (marcador ? { lat: marcador.getLatLng().lat, lon: marcador.getLatLng().lng } : origem);
  camadaRota.clearLayers(); resumo.textContent = ''; linhaRota = null;
  if (!destino) return;
  if (!de) { resumo.textContent = 'Escolha de onde sair (toque no mapa em "Sair daqui") ou ligue o GPS.'; return; }
  if (!grafo) { resumo.textContent = 'Preparando as ruas…'; calcularQuandoPronto = true; return; }
  var a = Rota.maisPerto(grafo, de.lat, de.lon, 500), b = Rota.maisPerto(grafo, destino.lat, destino.lon, 500);
  if (!a) { resumo.textContent = 'Não há rua permitida perto do ponto de saída.'; return; }
  if (!b) { resumo.textContent = 'Não há rua permitida perto do destino.'; return; }
  var r = Rota.caminho(grafo, a.no, b.no, false);
  if (!r) r = Rota.caminho(grafo, a.no, b.no, true);
  if (!r) { resumo.textContent = 'Não achei caminho só por vias permitidas entre esses dois pontos.'; return; }
  rotaAtual = Guia.preparar(r); rotaAtual.temIncerta = r.temIncerta; rotaAtual.trechos = r.trechos; progresso = 0; foraConta = 0;
  linhaRota = L.polyline(r.pontos, { color: '#7a1fd1', weight: 7, opacity: .9, pane: 'gps', interactive: false }).addTo(camadaRota);
  achados.textContent = '';
  document.getElementById('linha-busca').style.display = 'none';
  if (emGuia) { desenharGuia(); return; }
  [[de, a], [destino, b]].forEach(function (x) {
    if (x[1].dist > 15) L.polyline([[x[0].lat, x[0].lon], [grafo.lat[x[1].no], grafo.lon[x[1].no]]], { color: '#7a1fd1', weight: 3, dashArray: '4 6', pane: 'gps', interactive: false }).addTo(camadaRota);
  });
  var min = Math.max(1, Math.round(r.metros / 1000 / VELOCIDADE_KMH * 60));
  var t = document.createElement('div');
  var linha = document.createElement('div'); linha.className = 'linha-rota';
  var soma = document.createElement('span'); soma.className = 'soma'; soma.textContent = metros(r.metros) + ' · ' + min + ' min'; linha.appendChild(soma);
  var lista = document.createElement('div'); lista.className = 'lista-ruas'; lista.style.display = 'none';
  r.trechos.forEach(function (z) { var li = document.createElement('div'); li.textContent = z.nome + ' · ' + metros(z.metros); lista.appendChild(li); });
  var ruas = document.createElement('button'); ruas.className = 'leve'; ruas.textContent = 'Ruas';
  ruas.addEventListener('click', function () { lista.style.display = lista.style.display === 'none' ? 'block' : 'none'; });
  var ir = document.createElement('button'); ir.textContent = 'Iniciar'; ir.addEventListener('click', iniciarGuia);
  var lim = document.createElement('button'); lim.className = 'leve'; lim.textContent = 'Limpar'; lim.addEventListener('click', limpar);
  linha.appendChild(ir); linha.appendChild(ruas); linha.appendChild(lim); t.appendChild(linha);
  if (r.temIncerta) { var l2 = document.createElement('div'); l2.className = 'aviso-rota'; l2.textContent = 'Passa por trecho sem velocidade marcada: confira a placa.'; t.appendChild(l2); }
  t.appendChild(lista);
  resumo.appendChild(t);
  mapa.fitBounds(L.latLngBounds(r.pontos).extend([de.lat, de.lon]).extend([destino.lat, destino.lon]), { paddingTopLeft: [20, 90], paddingBottomRight: [20, 80] });
}

// ---------- guia passo a passo ----------
function desenharGuia() {
  resumo.textContent = '';
  var t = document.createElement('div');
  var instr = document.createElement('div'); instr.className = 'guia-instr'; instr.id = 'guia-instr'; t.appendChild(instr);
  var linha = document.createElement('div'); linha.className = 'linha-rota'; linha.style.marginTop = '6px';
  var resto = document.createElement('span'); resto.className = 'guia-resto'; resto.id = 'guia-resto'; linha.appendChild(resto);
  var parar = document.createElement('button'); parar.className = 'leve'; parar.textContent = 'Parar'; parar.addEventListener('click', pararGuia);
  linha.appendChild(parar); t.appendChild(linha);
  if (rotaAtual.temIncerta) { var l2 = document.createElement('div'); l2.className = 'aviso-rota'; l2.textContent = 'Tem trecho sem velocidade marcada: confira a placa.'; t.appendChild(l2); }
  resumo.appendChild(t);
  var pr = marcador ? Guia.projetar(rotaAtual, marcador.getLatLng().lat, marcador.getLatLng().lng, 0, 80) : null;
  textoGuia(Guia.proximo(rotaAtual, 0), pr ? pr.along : 0);
  if (marcador) mapa.setView(marcador.getLatLng(), Math.max(mapa.getZoom(), 17));
}

function textoGuia(passo, along) {
  var i = document.getElementById('guia-instr'), r = document.getElementById('guia-resto');
  if (!i) return;
  var falta = Math.max(0, rotaAtual.cum[passo.i] - along);
  if (passo.texto === 'Você chegou') i.textContent = falta < 25 ? 'Você chegou' : 'Siga em frente, o destino está a ' + metros(falta);
  else i.textContent = passo.texto + (falta < 15 ? ' agora' : ' em ' + metros(falta));
  var resta = Math.max(0, rotaAtual.total - along);
  r.textContent = metros(resta) + ' · ' + Math.max(1, Math.round(resta / 1000 / VELOCIDADE_KMH * 60)) + ' min';
}

function iniciarGuia() {
  if (!rotaAtual || !marcador) { aviso('Ligue o GPS para usar o guia'); return; }
  guiando = true;
  if (origem) { origem = null; if (pinos.origem) { mapa.removeLayer(pinos.origem); pinos.origem = null; } }
  pedirBussola();
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { travaTela = w; }).catch(function () {}); } catch (e) {}
  calcular({ guia: true });
  entrarNavegacao();
}

function pararGuia() {
  guiando = false; sairNavegacao();
  if (travaTela) { try { travaTela.release(); } catch (e) {} travaTela = null; }
  calcular();
}

function atualizarGuia(ll, precisao) {
  if (!guiando || !rotaAtual) return;
  var pr = Guia.projetar(rotaAtual, ll[0], ll[1], progresso - 2, progresso + 80);
  if (!pr) return;
  if (pr.dist > 40 && precisao < 60) {
    foraConta++;
    if (foraConta >= 2) { foraConta = 0; aviso('Recalculando…'); setTimeout(function () { aviso(''); }, 2000); calcular({ guia: true }); return; }
  } else foraConta = 0;
  progresso = pr.seg;
  if (linhaRota) linhaRota.setLatLngs([[pr.lat, pr.lon]].concat(rotaAtual.pts.slice(pr.seg + 1)));
  if (rotaAtual.total - pr.along < 25) {
    var i = document.getElementById('guia-instr'); if (i) i.textContent = 'Você chegou';
    var r = document.getElementById('guia-resto'); if (r) r.textContent = '';
    guiando = false; sairNavegacao(); if (travaTela) { try { travaTela.release(); } catch (e) {} travaTela = null; }
    return;
  }
  textoGuia(Guia.proximo(rotaAtual, pr.seg), pr.along);
  if (seguindo) centrarNaPosicao();
}

// busca de lugar: primeiro nos lugares e ruas guardados de Jacareí, depois no Nominatim
var viasCarregadas = [], indiceBusca = null;
var TIPOS = { fitness_centre: 'academia', sports_centre: 'esporte', restaurant: 'restaurante', fast_food: 'lanchonete', cafe: 'café', bakery: 'padaria', pharmacy: 'farmácia', supermarket: 'mercado', convenience: 'mercado', school: 'escola', university: 'faculdade', hospital: 'hospital', clinic: 'clínica', bank: 'banco', fuel: 'posto', bus_station: 'rodoviária', place_of_worship: 'igreja', park: 'parque', suburb: 'bairro', neighbourhood: 'bairro', quarter: 'bairro', city: 'cidade', town: 'cidade', mall: 'shopping', clothes: 'roupas', hairdresser: 'cabeleireiro', car_repair: 'oficina', bar: 'bar', pub: 'bar', cinema: 'cinema', police: 'polícia', townhall: 'prefeitura' };
var PARTICULAS = { de: 1, da: 1, do: 1, dos: 1, das: 1, e: 1, a: 1, o: 1 };
function norm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

function montarIndice(lugares) {
  var lista = [], vistas = {};
  (lugares || []).forEach(function (l) { lista.push({ n: l[0], k: norm(l[0]), lat: l[1], lon: l[2], t: TIPOS[l[3]] || '' }); });
  viasCarregadas.forEach(function (v) {
    var nome = v.t.name; if (!nome || vistas[nome]) return;
    vistas[nome] = 1;
    var m = v.g[Math.floor(v.g.length / 2)];
    lista.push({ n: nome, k: norm(nome), lat: m[0], lon: m[1], t: 'rua' });
  });
  return lista;
}

function buscarLocal(q) {
  var toks = norm(q).split(/[^a-z0-9]+/).filter(function (t) { return t && !PARTICULAS[t]; });
  if (!toks.length) return [];
  var centro = marcador ? marcador.getLatLng() : mapa.getCenter(), out = [];
  indiceBusca.forEach(function (e) {
    var achou = 0;
    toks.forEach(function (t) { if (e.k.indexOf(t) >= 0) achou++; });
    var nec = toks.length === 1 ? 1 : Math.ceil(toks.length / 2);
    if (achou < nec) return;
    out.push({ e: e, score: achou / toks.length, d: Rota.haversine(centro.lat, centro.lng, e.lat, e.lon) });
  });
  out.sort(function (x, y) { return y.score - x.score || x.d - y.d; });
  return out.slice(0, 6);
}

function fecharAchados() { achados.textContent = ''; }
mapa.on('click', fecharAchados);
mapa.on('dragstart', fecharAchados);
mapa.on('popupopen', fecharAchados);

function mostrarAchados(itens) {
  achados.textContent = '';
  itens.forEach(function (x) {
    var b = document.createElement('button');
    b.textContent = x.nome + (x.tipo ? ' · ' + x.tipo : '') + (x.dist != null ? ' · ' + metros(x.dist) : '');
    b.addEventListener('click', function () { achados.textContent = ''; definir('destino', x.lat, x.lon); });
    achados.appendChild(b);
  });
  var fechar = document.createElement('button'); fechar.className = 'leve'; fechar.textContent = 'Fechar'; fechar.style.marginTop = '6px';
  fechar.addEventListener('click', fecharAchados); achados.appendChild(fechar);
}

function semResultado() {
  achados.textContent = 'Não encontrei esse lugar em Jacareí.';
  setTimeout(function () { if (achados.textContent === 'Não encontrei esse lugar em Jacareí.') fecharAchados(); }, 4000);
}

var campoBusca = document.getElementById('busca'), achados = document.getElementById('achados');
function buscar() {
  var q = campoBusca.value.trim(); if (!q) return;
  achados.textContent = 'Buscando…';
  var pronto = indiceBusca ? Promise.resolve() : fetch('lugares.json?v=1').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }).then(function (l) { indiceBusca = montarIndice(l); });
  pronto.then(function () {
    var locais = buscarLocal(q).map(function (x) { return { nome: x.e.n, tipo: x.e.t, lat: x.e.lat, lon: x.e.lon, dist: x.d }; });
    if (locais.length >= 3) { mostrarAchados(locais); return; }
    return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=br&bounded=1&viewbox=-46.12,-23.15,-45.80,-23.45&accept-language=pt-BR&q=' + encodeURIComponent(q))
      .then(function (r) { if (!r.ok) throw new Error('erro ' + r.status); return r.json(); })
      .then(function (lista) {
        var extras = lista.map(function (x) { return { nome: x.display_name.split(',').slice(0, 3).join(','), tipo: '', lat: parseFloat(x.lat), lon: parseFloat(x.lon), dist: null }; });
        var todos = locais.concat(extras);
        if (!todos.length) semResultado(); else mostrarAchados(todos);
      })
      .catch(function () { if (locais.length) mostrarAchados(locais); else semResultado(); });
  });
}
document.getElementById('buscar').addEventListener('click', buscar);
campoBusca.addEventListener('keydown', function (e) { if (e.key === 'Enter') buscar(); if (e.key === 'Escape') { fecharAchados(); campoBusca.blur(); } });
campoBusca.addEventListener('input', function () { if (!campoBusca.value.trim()) fecharAchados(); });

// GPS
var marcador = null, circulo = null, primeiraVez = true;
function posicao(p) {
  var ll = [p.coords.latitude, p.coords.longitude];
  ultimoLL = ll;
  if (p.coords.speed > 1.2 && typeof p.coords.heading === 'number' && !isNaN(p.coords.heading)) definirRumo(p.coords.heading, 'gps');
  if (guiando) {
    if (!seta) seta = L.marker(ll, { icon: L.divIcon({ className: '', html: '<svg id="seta" width="36" height="36" viewBox="0 0 36 36"><path d="M18 3 L28 30 L18 24 L8 30 Z" fill="#7a1fd1" stroke="#fff" stroke-width="2"/></svg>', iconSize: [36, 36], iconAnchor: [18, 18] }), interactive: false, keyboard: false }).addTo(mapa);
    seta.setLatLng(ll);
  } else if (seta) { mapa.removeLayer(seta); seta = null; }
  if (!marcador) {
    circulo = L.circle(ll, { radius: p.coords.accuracy, color: '#d11f1f', weight: 1, fillOpacity: .08, pane: 'gps', interactive: false }).addTo(mapa);
    marcador = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#7a1fd1', fillOpacity: 1, pane: 'gps', interactive: false }).addTo(mapa);
  } else {
    marcador.setLatLng(ll);
    circulo.setLatLng(ll).setRadius(p.coords.accuracy);
  }
  if (primeiraVez) { primeiraVez = false; if (destino && !origem) calcular(); else mapa.setView(ll, 16); }
  atualizarGuia(ll, p.coords.accuracy);
}
function iniciarGps() {
  if (!navigator.geolocation) { aviso('Este aparelho não tem GPS'); return; }
  navigator.geolocation.watchPosition(posicao,
    function () { aviso('Permita o acesso à localização'); },
    { enableHighAccuracy: true, maximumAge: 5000 });
}
document.getElementById('btn-legenda').addEventListener('click', function () {
  var l = document.getElementById('legenda'); l.style.display = l.style.display === 'block' ? 'none' : 'block';
});
document.getElementById('gps').addEventListener('click', function () {
  if (guiando && !seguindo) { voltarAoGuia(); return; }
  if (marcador) mapa.setView(marcador.getLatLng(), 16);
  else { primeiraVez = true; iniciarGps(); }
});
iniciarGps();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
