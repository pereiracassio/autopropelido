name: Atualizar lugares de Jacareí

on:
  workflow_dispatch:
  push:
    branches: [claude/jolly-davinci-8uissp]
    paths: [scripts/baixar-lugares.py]
  schedule:
    - cron: '0 7 1 * *'

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Baixar os lugares
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          python3 scripts/baixar-lugares.py
