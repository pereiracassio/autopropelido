name: Paraciclos

on:
  workflow_dispatch:
  push:
    branches: [claude/jolly-davinci-8uissp]
    paths: [.github/workflows/paraciclos.yml, scripts/baixar-paraciclos.py]
  schedule:
    - cron: '0 9 1 * *'

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Baixar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          SOMAR=1 GRADE=8 python3 scripts/baixar-paraciclos.py
