name: Lombadas, semáforos, recarga e consertos

on:
  workflow_dispatch:
  push:
    branches: [claude/jolly-davinci-8uissp]
    paths: [.github/workflows/pontos.yml]
  schedule:
    - cron: '0 8 1 * *'

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Baixar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          python3 scripts/baixar-pontos.py
