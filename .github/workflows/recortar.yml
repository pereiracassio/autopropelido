name: Deixar só Jacareí

on:
  workflow_dispatch:
  push:
    branches: [claude/jolly-davinci-8uissp]
    paths: [scripts/recortar.py]

permissions:
  contents: write

jobs:
  recortar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Recortar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          python3 scripts/recortar.py
          git add vias.json lugares.json limite.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Só Jacareí"
          git push || (git pull -q --rebase -X theirs && git push)
