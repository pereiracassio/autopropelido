name: Atualizar vias de Jacareí

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Baixar as vias
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          python3 scripts/baixar-vias.py
          python3 scripts/recortar.py
          git add vias.json limite.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Vias só de Jacareí"
          git push || (git pull -q --rebase -X theirs && git push)
